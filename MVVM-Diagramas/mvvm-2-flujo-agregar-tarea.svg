<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#FFFFFF"/>

  <text x="620" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#1B3A8A">Flujo unidireccional: agregar una tarea paso a paso</text>
  <text x="620" y="76" text-anchor="middle" font-size="16" fill="#64748B">TareaListScreen → TareasViewModel → GestorDeTareas → Room, y el estado nuevo vuelve por el otro camino</text>

  <!-- Encabezados de lifelines -->
  <rect x="50" y="100" width="240" height="64" rx="10" fill="#1E4DB7"/>
  <text x="170" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Vista</text>
  <text x="170" y="150" text-anchor="middle" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">TareaListScreen</text>

  <rect x="360" y="100" width="240" height="64" rx="10" fill="#A16207"/>
  <text x="480" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">ViewModel</text>
  <text x="480" y="150" text-anchor="middle" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">TareasViewModel</text>

  <rect x="670" y="100" width="240" height="64" rx="10" fill="#1F7A4D"/>
  <text x="790" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Modelo</text>
  <text x="790" y="150" text-anchor="middle" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">GestorDeTareas</text>

  <rect x="980" y="100" width="240" height="64" rx="10" fill="#475569"/>
  <text x="1100" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Datos</text>
  <text x="1100" y="150" text-anchor="middle" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#FFFFFF">Room · TareaDao</text>

  <!-- Lifelines -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6">
    <line x1="170" y1="164" x2="170" y2="690"/>
    <line x1="480" y1="164" x2="480" y2="690"/>
    <line x1="790" y1="164" x2="790" y2="690"/>
    <line x1="1100" y1="164" x2="1100" y2="690"/>
  </g>

  <!-- 1. Vista -> ViewModel -->
  <text x="325" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#D9480F">1. agregarTarea(titulo)</text>
  <line x1="172" y1="228" x2="476" y2="228" stroke="#D9480F" stroke-width="3" marker-end="url(#arrOrange)"/>

  <!-- 2. Nota ViewModel -->
  <rect x="355" y="254" width="250" height="44" rx="8" fill="#FEF3C7" stroke="#F5C84B" stroke-width="1.5"/>
  <text x="480" y="281" text-anchor="middle" font-size="15" fill="#1E293B">2. Valida: ¿título vacío?</text>

  <!-- 3. ViewModel -> Modelo -->
  <text x="635" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#D9480F">3. agregarTarea(titulo)</text>
  <line x1="482" y1="354" x2="786" y2="354" stroke="#D9480F" stroke-width="3" marker-end="url(#arrOrange)"/>

  <!-- 4. Modelo -> Datos -->
  <text x="945" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#D9480F">4. insertar(TareaEntity)</text>
  <line x1="792" y1="414" x2="1096" y2="414" stroke="#D9480F" stroke-width="3" marker-end="url(#arrOrange)"/>

  <!-- 5. Datos -> Modelo -->
  <text x="945" y="462" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">5. observarTodas() emite lista</text>
  <line x1="1098" y1="474" x2="794" y2="474" stroke="#0F766E" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#arrTeal)"/>

  <!-- 6. Modelo -> ViewModel -->
  <text x="635" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">6. Flow&lt;List&lt;Tarea&gt;&gt; nuevo</text>
  <line x1="788" y1="534" x2="484" y2="534" stroke="#0F766E" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#arrTeal)"/>

  <!-- 7. ViewModel -> Vista -->
  <text x="325" y="582" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">7. uiState: nuevo estado</text>
  <line x1="478" y1="594" x2="174" y2="594" stroke="#0F766E" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#arrTeal)"/>

  <!-- 8. Nota Vista -->
  <rect x="45" y="620" width="250" height="52" rx="8" fill="#E8EEFB" stroke="#8FA9E6" stroke-width="1.5"/>
  <text x="170" y="643" text-anchor="middle" font-size="15" fill="#1E293B">8. Compose se recompone</text>
  <text x="170" y="662" text-anchor="middle" font-size="15" fill="#1E293B">y dibuja la lista nueva</text>

  <!-- Banner -->
  <rect x="30" y="702" width="1180" height="62" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="620" y="729" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3A8A">La Vista nunca modifica los datos directamente.</text>
  <text x="620" y="751" text-anchor="middle" font-size="15" fill="#1E293B">Las acciones (naranja) bajan por un camino; el estado nuevo (verde) regresa por otro: flujo unidireccional.</text>
</svg>
