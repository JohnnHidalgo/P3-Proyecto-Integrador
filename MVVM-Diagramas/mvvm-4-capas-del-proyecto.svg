<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1240" height="740" fill="#FFFFFF"/>

  <text x="620" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1B3A8A">MVVM en el proyecto Task Manager UPB</text>
  <text x="620" y="74" text-anchor="middle" font-size="16" fill="#64748B">Capas y paquetes bajo com.upb.taskmanager (las flechas siempre apuntan hacia abajo)</text>

  <!-- ============ FILA 1: VISTA ============ -->
  <rect x="40" y="100" width="820" height="120" rx="12" fill="#E8EEFB" stroke="#8FA9E6" stroke-width="2"/>
  <text x="60" y="128" font-size="19" font-weight="700" fill="#1E4DB7">VISTA  ·  Jetpack Compose</text>
  <rect x="690" y="110" width="150" height="26" rx="13" fill="#1E4DB7"/>
  <text x="765" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Sesiones 4 a 8, 25</text>

  <rect x="60" y="146" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#8FA9E6"/>
  <text x="72" y="166" font-size="14" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#1E4DB7">ui.screens</text>
  <text x="72" y="184" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaListScreen</text>
  <text x="72" y="200" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaDetailScreen</text>

  <rect x="260" y="146" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#8FA9E6"/>
  <text x="272" y="166" font-size="14" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#1E4DB7">ui.components</text>
  <text x="272" y="184" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaCard</text>
  <text x="272" y="200" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaFormulario</text>

  <rect x="460" y="146" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#8FA9E6"/>
  <text x="472" y="166" font-size="14" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#1E4DB7">ui.theme</text>
  <text x="472" y="184" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TaskManagerTheme</text>
  <text x="472" y="200" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">Color, Type</text>

  <rect x="660" y="146" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#8FA9E6"/>
  <text x="672" y="166" font-size="14" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#1E4DB7">navigation</text>
  <text x="672" y="184" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">AppNavigation</text>

  <!-- flecha 1->2 -->
  <line x1="450" y1="222" x2="450" y2="258" stroke="#475569" stroke-width="3" marker-end="url(#arrDark)"/>
  <text x="472" y="245" font-size="13" fill="#475569">observa uiState / envía eventos</text>

  <!-- ============ FILA 2: VIEWMODEL ============ -->
  <rect x="40" y="260" width="820" height="100" rx="12" fill="#FEF3C7" stroke="#F5C84B" stroke-width="2"/>
  <text x="60" y="288" font-size="19" font-weight="700" fill="#A16207">VIEWMODEL  ·  paquete viewmodel</text>
  <rect x="690" y="270" width="150" height="26" rx="13" fill="#A16207"/>
  <text x="765" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Sesiones 12 y 13</text>
  <text x="60" y="320" font-size="15" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareasViewModel · TareasUiState</text>
  <text x="60" y="344" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#475569">val uiState: StateFlow&lt;TareasUiState&gt;</text>

  <!-- flecha 2->3 -->
  <line x1="450" y1="362" x2="450" y2="398" stroke="#475569" stroke-width="3" marker-end="url(#arrDark)"/>
  <text x="472" y="385" font-size="13" fill="#475569">llama (suspend) y recibe Flow</text>

  <!-- ============ FILA 3: MODELO ============ -->
  <rect x="40" y="400" width="820" height="100" rx="12" fill="#E6F5EC" stroke="#8FD0AB" stroke-width="2"/>
  <text x="60" y="428" font-size="19" font-weight="700" fill="#1F7A4D">MODELO  ·  paquete model</text>
  <rect x="690" y="410" width="150" height="26" rx="13" fill="#1F7A4D"/>
  <text x="765" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Sesiones 3 y 23</text>
  <text x="60" y="460" font-size="15" font-weight="700" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">Tarea · GestorDeTareas</text>
  <text x="60" y="484" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#475569">fun observarTareas(): Flow&lt;List&lt;Tarea&gt;&gt;</text>

  <!-- flechas 3->4 -->
  <line x1="240" y1="502" x2="240" y2="548" stroke="#475569" stroke-width="3" marker-end="url(#arrDark)"/>
  <line x1="660" y1="502" x2="660" y2="548" stroke="#475569" stroke-width="3" marker-end="url(#arrDark)"/>

  <!-- ============ FILA 4: FUENTES DE DATOS ============ -->
  <rect x="40" y="550" width="400" height="150" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="578" font-size="18" font-weight="700" fill="#475569">data.local  ·  Room</text>
  <rect x="290" y="560" width="140" height="24" rx="12" fill="#475569"/>
  <text x="360" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Sesiones 20 y 21</text>
  <text x="60" y="610" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaEntity</text>
  <text x="60" y="630" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaDao</text>
  <text x="60" y="650" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaDatabase</text>
  <text x="60" y="670" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareasLocalRepository</text>
  <text x="60" y="690" font-size="12" fill="#475569">Fuente única de verdad de las tareas</text>

  <rect x="460" y="550" width="400" height="150" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="480" y="578" font-size="18" font-weight="700" fill="#475569">data.remote  ·  Retrofit</text>
  <rect x="710" y="560" width="140" height="24" rx="12" fill="#475569"/>
  <text x="780" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Sesiones 14 y 15</text>
  <text x="480" y="610" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">ApiService</text>
  <text x="480" y="630" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">RetrofitInstance</text>
  <text x="480" y="650" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareaDto</text>
  <text x="480" y="670" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">TareasRemoteRepository</text>
  <text x="480" y="690" font-size="12" fill="#475569">Solo aporta datos de ejemplo al inicio</text>

  <!-- ============ DATASTORE (a la derecha) ============ -->
  <rect x="900" y="550" width="300" height="150" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="920" y="578" font-size="18" font-weight="700" fill="#6D28D9">data.datastore</text>
  <rect x="1050" y="560" width="140" height="24" rx="12" fill="#6D28D9"/>
  <text x="1120" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Sesión 22</text>
  <text x="920" y="614" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1E293B">PreferenciasUsuario</text>
  <text x="920" y="640" font-size="12" fill="#475569">Preferencia de la pantalla:</text>
  <text x="920" y="658" font-size="12" fill="#475569">"mostrar solo pendientes"</text>

  <!-- Linea punteada UI -> DataStore -->
  <path d="M 860 160 L 1050 160 L 1050 548" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrDash)"/>
  <rect x="900" y="200" width="300" height="130" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="918" y="226" font-size="14" font-weight="700" fill="#6D28D9">Excepción consciente</text>
  <text x="918" y="250" font-size="13" fill="#1E293B">La pantalla lee DataStore</text>
  <text x="918" y="270" font-size="13" fill="#1E293B">directamente: es una</text>
  <text x="918" y="290" font-size="13" fill="#1E293B">preferencia de interfaz, no</text>
  <text x="918" y="310" font-size="13" fill="#1E293B">un dato de negocio.</text>
</svg>
